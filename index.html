<!DOCTYPE html>
<html>
<head>
<title>GPA Calculator</title>
<style>
    .subjects {
    display: grid;
    grid-template-columns: 250px 100px; /* label column + input column */
    gap: 8px 15px;
    align-items: center;
    justify-content: center; /* centers the entire grid horizontally */
    margin: 0 auto; /* ensures the block itself is centered */
}
.subjects label {
    text-align: right;
    margin-right: 10px;
}
.subjects input {
    width: 80px;
    padding: 6px;
    border-radius: 5px;
    border: 1px solid #444;
}

  table {
    border-collapse: collapse;
    width: auto;
    border: 1px solid black; /* Outer border */
  }
  th, td {
    border: 1px solid black; /* Inner borders */
    padding: 8px;
    text-align: left;
  }
  th {
    font-weight: bold;
  }
    body {
        background: #111;
        color: #fff;
        font-family: Arial;
        padding: 20px;
    }
    input {
        padding: 6px;
        margin: 5px 0;
        border-radius: 5px;
        border: 1px solid #444;
        width: 100px;
    }
    button {
        padding: 8px 15px;
        margin-top: 10px;
        border: none;
        border-radius: 5px;
        background: #4caf50;
        color: white;
        font-size: 16px;
    }
    /* Alignment for subjects */
    .subjects {
        display: grid;
        grid-template-columns: 250px 100px; /* label column + input column */
        gap: 8px 15px;
        align-items: center;
    }
    .subjects label {
        text-align: right;
        margin-right: 10px;
    }
</style>
</head>
<body>
    <center>
    <h2>IFET ECE GPA Calculator(IV SEM)</h2>
    <hr>
<table>
  <thead>
    <tr>
      <th>Letter Grade</th>
      <th>Grade</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>O (Outstanding)</td>
      <td>10</td>
    </tr>
    <tr>
      <td>A+ (Excellent)</td>
      <td>9</td>
    </tr>
    <tr>
      <td>A (Very Good)</td>
      <td>8</td>
    </tr>
    <tr>
      <td>B+ (Good)</td>
      <td>7</td>
    </tr>
    <tr>
      <td>B (Average)</td>
      <td>6</td>
    </tr>
    <tr>
      <td>C (Satisfactory)</td>
      <td>5</td>
    </tr>
    <tr>
      <td>U (Re-Appearance)</td>
      <td>0</td>
    </tr>
    <tr>
      <td>SA (Shortage of Attendance)</td>
      <td>-</td>
    </tr>
    <tr>
      <td>UA (Absent)</td>
      <td>-</td>
    </tr>
    <tr>
      <td>WD (Withdrawal)</td>
      <td>-</td>
    </tr>
  </tbody>
</table>

    <h3>Enter grades for each course:</h3>
    <center>
    <div class="subjects">
        
        <label for="A">EMF</label> <input type="number" id="A" value="0">
        <label for="B">LIC:</label> <input type="number" id="B" value="0">
        <label for="C">MAMC:</label> <input type="number" id="C" value="0">
        <label for="D">CS:</label> <input type="number" id="D" value="0">
        <label for="E">LIC LABORATORY:</label> <input type="number" id="E" value="0">
        <label for="F">MAMC LABORATORY:</label> <input type="number" id="F" value="0">
        <label for="G">ENGLISH LANGUAGE TRAINING:</label> <input type="number" id="G" value="0">
        <label for="H">ANALYTICAL SKILLS II:</label> <input type="number" id="H" value="0">
        <label for="I">PDL:</label> <input type="number" id="I" value="0">
        <label for="J">INTERNSHIP</label> <input type="number" id="J" value="0">
        
    </div>
    </center>
    <button onclick="calcGPA()">Calculate GPA</button>
    <h3 id="gpaResult"></h3>

    

    <hr>
    <h3>CGPA</h3>
    <input type="number" id="1" placeholder="1 semester">
    <input type="number" id="2" placeholder="2 semester">
    <input type="number" id="3" placeholder="3 semester">
    <input type="number" id="New" placeholder="Latest GPA">
    <button onclick="calcCGPA2()">Calculate CGPA</button>
    <h3 id="cgpa2Result"></h3>

<script>
function getGradeValue(id) {
    const value = Number(document.getElementById(id).value);
    return Number.isFinite(value) ? value : 0;
}

function calcGPA() {
    const credits = {
        A: 3,
        B: 3,
        C: 3,
        D: 3,
        E: 1.5,
        F: 1.5,
        G: 1.5,
        H: 1,
        I: 2,
        J: 1
    };

    let total = 0;
    Object.entries(credits).forEach(([subject, credit]) => {
        total += credit * getGradeValue(subject);
    });

    const totalCredits = 20.5;
    const gpa = total / totalCredits;
    const gpaValue = gpa.toFixed(2);

    document.getElementById("gpaResult").textContent = "GPA = " + gpaValue;
    document.getElementById("New").value = gpaValue;
    return gpaValue;
}

function calcCGPA2() {
    const 1sem = Number(document.getElementById("1").value);
    const 2sem = Number(document.getElementById("2").value);
    const 3sem = Number(document.getElementById("3").value);
    const newg = Number(document.getElementById("New").value);

    const cgpa = (1sem + 2sem + 3sem + newg) / 4;
    document.getElementById("cgpa2Result").textContent = "CGPA (4th SEM) = " + cgpa.toFixed(2);
}
</script>
</center>
</body>

</html>
